function issue(){const sn=$('#is').value.trim(),bt=$('#ib').value.trim(),d1=$('#d1').value,d2=$('#d2').value;
 const st=S.students.find(s=>s.cls==ic&&s.name.toLowerCase()==sn.toLowerCase());

${l.ret?'<span class="badge">തിരിച്ചേൽപ്പിച്ചു</span>':late(l)?'<span class="badge late">വൈകി</span>':'<span class="badge out">കൈയിലുണ്ട്</span>'}</div>${btn?`<button class="btn" onclick="giveBack('${l.id}')">തിരിച്ചെടുത്തു</button>`:''}</div>`;

function addStu(){const L=$('#sn').value.split('\n').map(x=>x.trim()).filter(Boolean);let n=0;
